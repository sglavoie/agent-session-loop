version: 2
updates:
  # Workflow actions are pinned to commit SHAs with a version comment;
  # Dependabot bumps both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

  # Development-only Playwright harness for the Workbench shell.
  - package-ecosystem: npm
    directory: /tests/workbench_browser
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
