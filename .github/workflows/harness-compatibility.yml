name: Harness compatibility

# Compatibility smoke for the three harness CLIs ASL launches: weekly, on
# demand, and on any push or pull request that changes the policy module or this
# workflow, so a moved pin is smoked before it lands rather than a week after.
#
# No model is used and no provider is contacted. The only subprocess the
# compatibility module ever builds is `<executable> --version`, and
# `tests/test_asl_harness_compatibility.py` pins the recorded argv to exactly
# `["--version"]`, so this workflow can install and exercise six third-party CLI
# releases without spending a token or needing a single provider credential.
#
# Two questions are asked, and they are deliberately gated differently:
#
#   `pinned` is the gate. Every version named by
#   `agent_session_loop.harness_compatibility.POLICY` -- the latest and the
#   previous supported line of each harness -- must still install and must still
#   classify as `supported`. A pinned release that vanished from the registry,
#   changed its `--version` sentence, or slipped outside the window is a real
#   compatibility regression and fails the run.
#
#   `drift` is advisory. It installs whatever each harness currently ships as
#   `latest` and reports the classification without failing the workflow. A new
#   upstream release lands here as `unknown` -- a warning to triage by moving the
#   pin and recording fresh smoke evidence -- rather than as a red build, which
#   is the whole reason `unknown` warns instead of blocking.
on:
  schedule:
    # Weekly, Mondays at 06:17 UTC. Off the hour so it does not queue behind
    # every other cron on the runner fleet.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # A change to POLICY (or to how it is smoked) is what this workflow judges.
  # The verdict also rests on how the executable is resolved
  # (`harnesses.py`, `resolve_executable`) and on the `harness-compat` parser
  # (`cli_parser_run.py`, `--harness` / `--strict`), so those trigger it too;
  # the weekly schedule catches anything subtler.
  push:
    branches: [main]
    paths:
      - "agent_session_loop/harness_compatibility.py"
      - "agent_session_loop/harnesses.py"
      - "agent_session_loop/cli_parser_run.py"
      - ".github/workflows/harness-compatibility.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent_session_loop/harness_compatibility.py"
      - "agent_session_loop/harnesses.py"
      - "agent_session_loop/cli_parser_run.py"
      - ".github/workflows/harness-compatibility.yml"

permissions:
  contents: read

# Runs on one ref queue instead of overlapping. Only a pull_request run cancels
# the one in progress, and that is a superseded run for the same pull request;
# a scheduled, manual or push run on main always finishes, so a manual dispatch
# never cuts a scheduled verdict short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pinned:
    name: ${{ matrix.harness }} ${{ matrix.line }}
    runs-on: ubuntu-24.04
    # One npm install and one `--version` call.
    timeout-minutes: 15
    strategy:
      # One harness release per job, and a failure in one must not hide the
      # verdict for the other five.
      fail-fast: false
      matrix:
        harness: [codex, claude, copilot]
        line: [latest, previous]
        include:
          - harness: codex
            package: "@openai/codex"
          - harness: claude
            package: "@anthropic-ai/claude-code"
          - harness: copilot
            package: "@github/copilot"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Nothing here pushes, so the token is not left in .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      # The version is read out of POLICY rather than repeated here. The
      # workflow knows how to install a harness; only the module knows which
      # release ASL claims to support, and duplicating that in YAML is how the
      # two silently disagree.
      - name: Resolve pinned version
        id: pin
        run: |
          version=$(python3 -c 'import sys; from agent_session_loop.harness_compatibility import POLICY; print(getattr(POLICY[sys.argv[1]], sys.argv[2]))' "${{ matrix.harness }}" "${{ matrix.line }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.harness }} ${{ matrix.line }} is $version"

      - name: Install ${{ matrix.package }}@${{ steps.pin.outputs.version }}
        run: npm install -g "${{ matrix.package }}@${{ steps.pin.outputs.version }}"

      # `--strict` fails on anything that is not `supported` (exit 1 for an
      # incompatible release, which wins, else 3 for an unknown one), and
      # exactly one harness is named, so this asserts the pinned release against
      # its own policy row and says nothing about the two that are not installed.
      - name: Compatibility smoke (no model use)
        run: |
          python3 -m agent_session_loop harness-compat \
            --harness "${{ matrix.harness }}" --strict --json

  drift:
    name: upstream drift (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Nothing here pushes, so the token is not left in .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install current releases
        run: |
          npm install -g \
            "@openai/codex@latest" \
            "@anthropic-ai/claude-code@latest" \
            "@github/copilot@latest"

      # Advisory by construction: `continue-on-error` turns the strict non-zero
      # exit (1 incompatible, 3 unknown) into a visible annotation rather than a
      # failed workflow. A harness that
      # has moved past the pinned window is news, not a broken build.
      - name: Report drift against the pinned window
        continue-on-error: true
        run: python3 -m agent_session_loop harness-compat --strict --json
