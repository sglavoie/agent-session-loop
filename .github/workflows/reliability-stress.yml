name: Reliability stress

# Repeat the fault scenarios on the platform that gates ASL releases. Keep the
# expensive load sweep off the per-commit path; it also runs on demand.
on:
  schedule:
    # Daily at 07:23 UTC, off the hour.
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A manual dispatch must not cancel a scheduled run's evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    name: macOS reliability stress
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Reliability stress gate
        # Leave time for artifact upload if the gate reaches its ceiling.
        timeout-minutes: 110
        run: just reliability-stress

      # The script preserves failures (including an advisory background-suite
      # failure) and interruptions. Upload even after a green gate so that an
      # advisory never loses its evidence. .cache is hidden, so opt it in.
      - name: Upload stress and failed shard logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reliability-stress-logs
          path: |
            .cache/reliability-stress/
            .cache/run_suite_logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
