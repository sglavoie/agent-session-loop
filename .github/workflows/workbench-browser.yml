name: Workbench browser

# The development-only Playwright harness in tests/workbench_browser drives the
# Workbench shell in Chromium and WebKit against both deployments. It is a
# workflow of its own, triggered by path, rather than a job in check.yml: it
# needs Node and two browser engines, and it has nothing to say about a change
# that touches neither the shell nor the harness. Dependabot bumps the harness's
# npm pins weekly, and this is what checks those bumps.
#
# macOS rather than Linux: WebKit on an Ubuntu runner needs a set of system
# libraries Playwright installs with sudo, and macOS is where the Workbench is
# developed and read from (desktop Safari and, via mobile-webkit, the phone).
#
# Third-party actions are pinned to commit SHAs (the tag they resolved from is
# in the trailing comment), and the runner to an explicit image, as in check.yml.
#
# The path filters name what the fixture server actually loads: it imports
# `tests.workbench_support` (and so `tests/__init__.py` and the
# `tests/workbench_support_*.py` sections), which seeds both deployments through
# `asl_workbench` and the `agent_session_loop` modules listed below. Those reach
# much of the CLI transitively; the Python suite's own Workbench shell tests,
# which share the same seeding, cover that wider surface on every push.
on:
  push:
    branches: [main]
    paths:
      - "tests/workbench_browser/**"
      - "tests/__init__.py"
      - "tests/workbench_support*.py"
      - "asl_workbench/**"
      - "agent_session_loop/workbench_*.py"
      - "agent_session_loop/cli.py"
      - "agent_session_loop/events.py"
      - "agent_session_loop/plans_files.py"
      - "agent_session_loop/state.py"
      - "justfile"
      - ".github/workflows/workbench-browser.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/workbench_browser/**"
      - "tests/__init__.py"
      - "tests/workbench_support*.py"
      - "asl_workbench/**"
      - "agent_session_loop/workbench_*.py"
      - "agent_session_loop/cli.py"
      - "agent_session_loop/events.py"
      - "agent_session_loop/plans_files.py"
      - "agent_session_loop/state.py"
      - "justfile"
      - ".github/workflows/workbench-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: Workbench browser (Playwright)
    # What `macos-latest` resolves to today, named so it cannot move under us.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Nothing here pushes, so the token is not left in .git/config.
          persist-credentials: false

      # The fixture server Playwright starts is `python3 fixture_server.py`.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/workbench_browser/package-lock.json

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # The Chromium and WebKit engines are the slow part of the install. The
      # lockfile pins Playwright, and each Playwright release pins its engine
      # builds, so the lockfile is the key. `just test-browser` still runs
      # `playwright install`, which only verifies the engines when they are
      # restored and downloads them when the key missed.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/workbench_browser/package-lock.json') }}

      - name: Workbench browser tests
        run: just test-browser
