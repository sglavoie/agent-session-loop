# Checked: the three codes, no linter. Seeded with the two package modules that
# import the runner — `compact_state` reads and rewrites a run's own state, and
# `workbench` drives runs — so the one-way dependency the Boundary table
# enforces is not something either of them could ever satisfy. Both are already
# clean under the three codes.
[[tool.mypy.overrides]]
module = [
    "agent_session_loop.compact_state",
    "agent_session_loop.workbench",
]
enable_error_code = [
    "arg-type",
    "union-attr",
    "index",
]
