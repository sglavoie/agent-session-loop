# Repository tooling configuration. This repo is not a distributable package,
# so it carries only tool tables and no PEP 621 packaging metadata: the suite
# runs as `python3 -m tests.run_suite`.

[tool.ruff]
line-length = 88
target-version = "py314"
# Extensionless Python executables are invisible to both gates otherwise: ruff
# globs *.py and lint.sh only claims files with a shell shebang.
extend-include = ["bin/.local/bin/agent-session-loop"]

# The portable half of the Workbench is deployed to a Pi documented at Python
# 3.13, while everything else here runs on the newer interpreter the repository
# targets above. Pinning the floor in the linter is what makes the boundary
# something a developer hits before a deployment does: a 3.14-only construct in
# `asl_workbench` is a lint failure, not an import error on the Pi.
# `asl_workbench.compatibility` enforces the same floor over the source, and
# `tests/test_workbench_foundations.py` checks that this entry still exists.
[tool.ruff.per-file-target-version]
"asl_workbench/**/*.py" = "py313"
# The portable test lane runs under the Pi's interpreter too -- the contract
# invokes `python3.13 -m unittest -q tests.test_workbench_portable` -- so the
# module and the `tests` package initializer it loads through are pinned to the
# same floor. Without this the formatter rewrites their `except` groups into
# 3.14 grammar and the lane fails to import before a single test runs.
"tests/__init__.py" = "py313"
"tests/test_workbench_portable.py" = "py313"
# The staging harness is copied to the Pi and run there beside the unpacked
# release, so it is held to the Pi's interpreter for the same reason and by the
# same mechanism. The cutover harness is copied there for the same purpose, and
# on the day it runs the Pi is mid-migration, which is the worst moment to
# discover a syntax error.
"tests/workbench_staging.py" = "py313"
"tests/workbench_cutover.py" = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# Focused extraction modules intentionally share a narrow internal namespace.
# Their facades retain the former public module surface, so static star-import
# diagnostics and intentional namespace-forwarding imports are not useful at
# those compatibility boundaries.
[tool.ruff.lint.per-file-ignores]
"agent_session_loop/execution_timing*.py" = ["F401", "F403", "F405"]
"agent_session_loop/workbench_local*.py" = ["F401", "F403", "F405"]
"agent_session_loop/supervisor_audit_agent*.py" = ["F401", "F403", "F405"]
"asl_workbench/integration*.py" = ["F401", "F403", "F405"]
"asl_workbench/integrations.py" = ["F401", "F403", "F405"]
"tests/asl_execution_timing_*.py" = ["F401", "F403", "F405"]
"tests/asl_turn_finalization_*.py" = ["F401", "F403", "F405"]
"tests/asl_tail_*.py" = ["F401", "F403", "F405"]
"tests/asl_live_redirect_*.py" = ["F401", "F403", "F405"]
"tests/support.py" = ["F401", "F403", "F405"]
"tests/support_base.py" = ["F401", "F403", "F405"]
"tests/support_plans.py" = ["F401", "F403", "F405"]
"tests/support_git.py" = ["F401", "F403", "F405"]
"tests/support_processes.py" = ["F401", "F403", "F405"]
"tests/support_review.py" = ["F401", "F403", "F405"]
"tests/support_workbench.py" = ["F401", "F403", "F405"]
"tests/support_prepare.py" = ["F401", "F403", "F405"]
"tests/test_asl_execution_timing.py" = ["F401"]
"tests/test_asl_tail.py" = ["F401"]
"tests/test_asl_turn_finalization.py" = ["F401"]
# Static ``__all__`` declarations make split-module vocabularies visible to
# mypy.  Keep those one-line declarations readable as a single contract.
"agent_session_loop/execution_timing_models.py" = ["E501"]
"agent_session_loop/supervisor_audit_agent_contract.py" = ["E501"]
"agent_session_loop/workbench_local_core.py" = ["E501"]
"asl_workbench/integration_core.py" = ["E501"]
"tests/asl_execution_timing_support.py" = ["E501"]
"tests/asl_live_redirect_support.py" = ["E501"]
"tests/asl_turn_finalization_support.py" = ["E501"]

[tool.mypy]
files = [
    "agent_session_loop",
    # The portable package starts life on this table rather than working
    # towards it. Its boundary rules and the extraction rules are the same
    # rules: it may not import the runner because it may not import ASL at
    # all, and its payloads cross a process boundary to a Pi, which is the
    # strongest reason to name what they hold.
    "asl_workbench",
    "tests",
    "skills/asl/scripts",
    "skills/session-resplit/scripts",
]
# Disposable repositories written by the opt-in live-worker evaluator. Each
# trial is a copy of the same fixture repository, so leaving them in scope
# makes every module in it a duplicate of itself once a second trial exists.
# The originals under `tests/fixtures/asl_worker_verification/repo` stay
# checked; only the runtime copies are excluded.
exclude = "^tests/fixtures/asl_worker_verification/cache/"
ignore_missing_imports = true
# Retained checks are the correctness classes: name-defined, attr-defined,
# call-arg, return-value and func-returns-value are all clean in the code and
# must stay that way. The codes below are suppressed repository-wide because
# clearing them needs generic-parameter and container-element annotations
# across a 125-file untyped tree, not defect fixes. Counts are the findings
# each code hid when it was added (mypy 2.3.0): arg-type 410, union-attr 389,
# index 368, assignment 27, var-annotated 18, misc 18, call-overload 9,
# operator 4, override 1. The last entry silences 9 notes, not errors: mypy
# does not check untyped function bodies, so the advice is inapplicable here.
disable_error_code = [
    "arg-type",
    "union-attr",
    "index",
    "assignment",
    "var-annotated",
    "misc",
    "call-overload",
    "operator",
    "override",
    "annotation-unchecked",
]

# Two override tables re-enable the three codes the repository-wide baseline
# still hides, under two different contracts. Both name the paths where an
# argument of the wrong type, an attribute read off an optional, or an index
# into something that is not a mapping would corrupt a durable record — a turn,
# a transition, a mailbox wait, a control command, a projection payload —
# rather than raise at the call site. Nothing in either table is a suppression,
# so the baseline above only ever shrinks. `enable_error_code`, not a shorter
# `disable_error_code`: a per-module disable list is unioned with the global
# one, so re-enabling is the only way back in.
#
# **Boundary** (below) — mypy codes *and* the AST linter in
# `tests/test_asl_typing_ratchet.py`: annotated public signatures,
# parameterized containers (recursively: `dict | None` and `list[dict]` are
# bare too), no `type: ignore`, no import of the runner. That
# linter encodes extraction discipline, which is meaningful for a package
# boundary and meaningless for a test module or for a package module whose job
# is to drive the runner. `runner` itself is on this table: the rule bans
# importing the runner, which the runner does not do, and it meets the other
# three unchanged — so the strongest available contract is the honest one for
# it, not a downgrade justified by its size.
#
# **Checked** (the table after it) — the same three mypy codes and nothing
# else. It is where a module lands when it is clean under mypy but cannot meet
# the extraction rules.
#
# The tables carry no name key of their own — mypy rejects one as an
# unrecognized option — so the ratchet names each by an anchor module only that
# table may list. `tests/test_asl_typing_ratchet.py` enforces every half of
# this: the global list may only shrink, neither table may add a suppression,
# each table has a floor set it may only grow past, and every module in the
# package is on exactly one of the two — that last check walks the package
# tree, so a new module joins a table or fails the ratchet.
[[tool.mypy.overrides]]
