# Repository tooling configuration. This repo is not a distributable package,
# so it carries only tool tables and no PEP 621 packaging metadata: the suite
# runs as `python3 -m tests.run_suite`.

[tool.ruff]
line-length = 88
target-version = "py314"
# Extensionless Python executables are invisible to both gates otherwise: ruff
# globs *.py and lint.sh only claims files with a shell shebang.
extend-include = ["bin/.local/bin/claude-lint-hook"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Compatibility shim: its imports exist only to re-export historical dotted
# names such as tests.test_agent_session_loop.VerificationExecutorTests.
"tests/test_agent_session_loop.py" = ["F401"]

[tool.mypy]
files = [
    "agent_session_loop",
    "tests",
    "skills/asl/scripts",
    "skills/session-resplit/scripts",
]
ignore_missing_imports = true
# Retained checks are the correctness classes: name-defined, attr-defined,
# call-arg, return-value and func-returns-value are all clean in the code and
# must stay that way. The codes below are suppressed repository-wide because
# clearing them needs generic-parameter and container-element annotations
# across a 125-file untyped tree, not defect fixes. Counts are the findings
# each code hid when it was added (mypy 2.3.0): arg-type 410, union-attr 389,
# index 368, assignment 27, var-annotated 18, misc 18, call-overload 9,
# operator 4, override 1. The last entry silences 9 notes, not errors: mypy
# does not check untyped function bodies, so the advice is inapplicable here.
disable_error_code = [
    "arg-type",
    "union-attr",
    "index",
    "assignment",
    "var-annotated",
    "misc",
    "call-overload",
    "operator",
    "override",
    "annotation-unchecked",
]

# The modules that already meet the boundary contract are typed, so they opt
# back in to the three codes the repository-wide baseline still hides. These
# are the paths where an argument of the wrong type, an attribute read off an
# optional, or an index into something that is not a mapping would corrupt a
# durable record — a turn, a transition, a mailbox wait, a control command, a
# projection payload — rather than raise at the call site. Every module that is
# clean under the three codes belongs on this list; nothing here is a
# suppression, so the baseline above only ever shrinks. `enable_error_code`, not a shorter `disable_error_code`: a
# per-module disable list is unioned with the global one, so re-enabling is the
# only way back in.
#
# `tests/test_asl_typing_ratchet.py` enforces both halves of that: the global
# list may only shrink, and this list may only grow.
[[tool.mypy.overrides]]
module = [
    "agent_session_loop",
    "agent_session_loop.__main__",
    "agent_session_loop.agent_mux_delivery",
    "agent_session_loop.agent_mux_pairing",
