[tool.mypy]
files = [
    "agent_session_loop",
    # The portable package starts life on this table rather than working
    # towards it. Its boundary rules and the extraction rules are the same
    # rules: it may not import the runner because it may not import ASL at
    # all, and its payloads cross a process boundary to a Pi, which is the
    # strongest reason to name what they hold.
    "asl_workbench",
    "tests",
    "skills/asl/scripts",
    "skills/session-resplit/scripts",
    # The installer and the `asl` wrapper run before the package does, so
    # nothing else type-checks them. The wrapper has no `.py` suffix; mypy
    # accepts a file named explicitly here whatever its suffix (directory
    # entries above only pick up `*.py`).
    "install.py",
    "bin/.local/bin/agent-session-loop",
]
# Disposable repositories written by the opt-in live-worker evaluator. Each
# trial is a copy of the same fixture repository, so leaving them in scope
# makes every module in it a duplicate of itself once a second trial exists.
# The originals under `tests/fixtures/asl_worker_verification/repo` stay
# checked; only the runtime copies are excluded.
exclude = "^tests/fixtures/asl_worker_verification/cache/"
ignore_missing_imports = true
# The codes below are suppressed repository-wide, and the list may only shrink.
# Product code no longer needs any of them: every module in
# `agent_session_loop` and `asl_workbench` is on one of the two package tables
# below, which re-enable all nine error codes, and the skill scripts sit on a
# third table that re-enables six. What the list still covers is `tests/` (as
# of mypy 2.3.1, with every code enabled: arg-type 644, union-attr 551,
# index 522, misc 64, var-annotated 18, assignment 13, call-overload 10,
# operator 3) and the skill scripts' arg-type/union-attr/index (38): container
# and optional annotations across untyped test code rather than defect fixes.
# The last entry silences notes, not errors: mypy does not check untyped
# function bodies, so the advice is inapplicable here.
#
# Not every file is checked, though: 163 files suppress mypy
# inline, almost all of them part modules of the split-module pattern, which
# share one namespace through `globals().update(...)` and star imports that
# mypy cannot follow. 34 package modules and 39 test modules carry
# `# mypy: disable-error-code="name-defined,attr-defined,..."`; 18 package
# modules (`commit_settlement*`, `copilot_acp*`, `guards*`), the five
# `resplit_*` script modules and 67 test files carry `# mypy: ignore-errors`,
# so no code applies to them whichever table lists them. That set, and the
# codes each file suppresses, is pinned by
# `tests/asl_typing_ratchet_section_suppressions.py` and may only shrink.
disable_error_code = [
    "arg-type",
    "union-attr",
    "index",
    "assignment",
    "var-annotated",
    "misc",
    "call-overload",
    "operator",
    "override",
    "annotation-unchecked",
]

# Three override tables re-enable what the repository-wide baseline hides,
# under three contracts. The package tables re-enable all nine error codes: the
# paths where an argument of the wrong type, an attribute read off an optional,
# an index into something that is not a mapping, or a variable rebound to a
# different type would corrupt a durable record — a turn, a transition, a
# mailbox wait, a control command, a projection payload — rather than raise at
# the call site. Nothing in any table is a suppression, so the baseline above
# only ever shrinks. `enable_error_code`, not a shorter `disable_error_code`: a
# per-module disable list is unioned with the global one, so re-enabling is the
# only way back in.
#
# **Boundary** (below) — mypy codes *and* the AST linter in
# `tests/test_asl_typing_ratchet.py`: annotated public signatures,
# parameterized containers (recursively: `dict | None` and `list[dict]` are
# bare too), no `type: ignore`, no import of the runner. That
# linter encodes extraction discipline, which is meaningful for a package
# boundary and meaningless for a test module or for a package module whose job
# is to drive the runner. `runner` itself is on this table: the rule bans
# importing the runner, which the runner does not do, and it meets the other
# three unchanged — so the strongest available contract is the honest one for
# it, not a downgrade justified by its size.
#
# **Checked** (the table after it) — the same nine mypy codes and nothing
# else. It is where a module lands when it is clean under mypy but cannot meet
# the extraction rules.
#
# **Scripts** (the last table) — the skill scripts under `skills/*/scripts`,
# which are not a package: mypy names each by its bare file stem. They are
# clean under every code except arg-type, union-attr and index, so the table
# re-enables the other six.
#
# The tables carry no name key of their own — mypy rejects one as an
# unrecognized option — so the ratchet names each by an anchor module only that
# table may list. `tests/test_asl_typing_ratchet.py` enforces every half of
# this: the global list may only shrink, no table may add a suppression, each
# package table has a floor set it may only grow past, every module in the
# package is on exactly one of the two package tables, and every skill script
# is on the scripts table — those last checks walk the trees, so a new module
# joins a table or fails the ratchet.
[[tool.mypy.overrides]]
module = [
    "agent_session_loop",
    "agent_session_loop.__main__",
