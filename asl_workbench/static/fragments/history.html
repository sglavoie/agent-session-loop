
    <!-- What has already finished. ASL stops projecting a run when it ends, so
         without this a run that finished while the operator was away leaves no
         trace on the screen at all. Narrowed by the same filters as the queue
         above it, and collapsed by default because it is not current work. -->
    <section
      class="wb-history"
      id="wb-history"
      data-open="false"
      aria-label="Finished runs"
    >
      <div class="wb-history__head">
        <button
          class="wb-button wb-button--ghost"
          id="wb-history-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="wb-history-list"
        >
          show history
        </button>
        <h2 class="wb-history__title">
          history <span class="wb-history__count" id="wb-history-count">0</span>
        </h2>
        <label class="wb-controls-bar__facet">
          <span class="wb-controls-bar__label">outcome</span>
          <select id="wb-history-outcome" aria-label="history outcome filter">
            <option value="">all outcomes</option>
            <option value="completed">completed</option>
            <option value="stopped">stopped</option>
            <option value="paused">paused</option>
            <option value="failed">failed</option>
            <option value="abandoned">abandoned</option>
            <option value="unknown">unknown</option>
          </select>
        </label>
      </div>
      <p class="wb-history__status" id="wb-history-status" role="status" hidden></p>
      <p class="wb-history__missing" id="wb-history-missing" role="status" hidden></p>
      <p class="wb-empty" id="wb-history-empty">no finished runs in this window</p>
      <ul class="wb-history__list" id="wb-history-list"></ul>
    </section>
