
      <aside class="wb-shell__placeholder" id="wb-shell-placeholder" hidden>
        <p>select a plan from the queue to inspect it</p>
      </aside>

      <aside class="wb-shell__preview" id="wb-shell-preview" hidden>
        <header class="wb-preview__head">
          <div class="wb-preview__head-text">
            <h2 class="wb-preview__label" id="wb-preview-label">(no plan)</h2>
            <p class="wb-preview__path" id="wb-preview-path"></p>
            <p class="wb-preview__badges">
              <span class="wb-badge" id="wb-preview-state" data-state="unknown">unknown</span>
              <span
                class="wb-badge wb-badge--ghost"
                id="wb-preview-activity"
                hidden
              ></span>
              <span
                class="wb-badge wb-badge--ghost"
                id="wb-preview-activity-source"
                data-source=""
                hidden
              ></span>
            </p>
            <p class="wb-preview__reason" id="wb-preview-reason" hidden></p>
            <p class="wb-preview__action" id="wb-preview-action" hidden></p>
          </div>
          <div class="wb-preview__head-actions">
            <a
              class="wb-button wb-button--primary"
              id="wb-preview-open"
              href="#"
              data-action="open-detail"
            >
              open detail
            </a>
          </div>
        </header>
        <dl class="wb-preview__facts" id="wb-preview-facts">
          <div><dt>next session</dt><dd data-field="next">-</dd></div>
          <div><dt>progress</dt><dd data-field="counts">-</dd></div>
          <div><dt>harness</dt><dd data-field="harness">-</dd></div>
          <div><dt>run started</dt><dd data-field="run">-</dd></div>
          <div><dt>workspace</dt><dd data-field="workspace">-</dd></div>
          <div><dt>repositories</dt><dd data-field="repositories">-</dd></div>
          <div><dt>last activity</dt><dd data-field="activity">-</dd></div>
          <div><dt>completed</dt><dd data-field="completed">-</dd></div>
        </dl>
        <section class="wb-preview__pause" id="wb-preview-pause" hidden>
          <h3 class="wb-preview__subtitle">pause</h3>
          <p class="wb-preview__pause-reason" id="wb-preview-pause-reason"></p>
          <p class="wb-preview__pause-message" id="wb-preview-pause-message"></p>
        </section>
        <section class="wb-preview__last-message" id="wb-preview-last-message-section" hidden>
          <h3 class="wb-preview__subtitle">last message</h3>
          <pre class="wb-preview__last-message-body" id="wb-preview-last-message-body"></pre>
        </section>
      </aside>
