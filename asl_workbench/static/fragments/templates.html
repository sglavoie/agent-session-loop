    <template id="wb-archive-row-template">
      <li class="wb-archive-row" data-archive-id="">
        <label class="wb-archive-row__select" data-field="archive-select">
          <input type="checkbox" aria-label="select archive entry" />
        </label>
        <div class="wb-archive-row__body">
          <span class="wb-archive-row__label" data-field="label"></span>
          <code class="wb-archive-row__path" data-field="path"></code>
          <span class="wb-archive-row__archived" data-field="archived"></span>
          <span class="wb-archive-row__expires" data-field="expires"></span>
          <span class="wb-archive-row__cleanup" data-field="cleanup"></span>
        </div>
        <div class="wb-archive-row__actions">
          <button
            class="wb-button wb-button--primary"
            type="button"
            data-action="archive-restore"
            data-operation-action="archive-restore"
          >
            restore
          </button>
          <button
            class="wb-button wb-button--danger"
            type="button"
            data-action="archive-purge"
            data-operation-action="archive-purge"
          >
            purge
          </button>
        </div>
      </li>
    </template>

    <template id="wb-section-template">
      <section class="wb-section" data-section="" data-count="0">
        <header class="wb-section__head">
          <h2 class="wb-section__title" data-section-heading></h2>
          <span class="wb-section__count" data-section-count>0</span>
        </header>
        <p class="wb-section__empty" data-section-empty hidden></p>
        <div class="wb-section__list" data-section-list></div>
      </section>
    </template>

    <template id="wb-project-group-template">
      <div class="wb-project-group" data-project="">
        <h3 class="wb-project-group__heading" data-group-heading></h3>
        <div class="wb-project-group__rows" data-group-rows></div>
      </div>
    </template>

    <template id="wb-history-row-template">
      <li class="wb-history-row" data-entry-id="" data-outcome="unknown">
        <header class="wb-history-row__head">
          <span class="wb-badge" data-field="outcome">unknown</span>
          <span class="wb-history-row__label" data-field="label"></span>
          <a class="wb-history-row__link" href="#" data-field="link">link</a>
        </header>
        <dl class="wb-history-row__facts">
          <div><dt>project</dt><dd data-field="project">-</dd></div>
          <div><dt>harness</dt><dd data-field="harness">-</dd></div>
          <div><dt>finished</dt><dd data-field="finished">-</dd></div>
          <div><dt>duration</dt><dd data-field="duration">-</dd></div>
          <div><dt>sessions</dt><dd data-field="sessions">-</dd></div>
          <div><dt>run id</dt><dd data-field="run">-</dd></div>
        </dl>
        <p class="wb-history-row__note" data-field="note" hidden></p>
      </li>
    </template>

    <template id="wb-row-template">
      <article class="wb-row" data-plan-dir="" tabindex="0">
        <header class="wb-row__head">
          <label class="wb-row__cleanup" data-field="cleanup-select" hidden>
            <input type="checkbox" aria-label="select plan for cleanup" />
          </label>
          <div class="wb-row__title">
            <span class="wb-badge" data-field="state">unknown</span>
            <a class="wb-row__label" href="#" data-field="label">(no label)</a>
          </div>
          <div class="wb-row__action">
            <button
              class="wb-button wb-button--primary"
              type="button"
              data-field="action"
            >
              run
            </button>
          </div>
        </header>
        <p class="wb-row__path" data-field="path"></p>
        <dl class="wb-row__facts">
          <div><dt>session</dt><dd data-field="session">-</dd></div>
          <div><dt>harness</dt><dd data-field="harness">-</dd></div>
          <div><dt>idle</dt><dd data-field="idle">-</dd></div>
          <div><dt>run started</dt><dd data-field="run">-</dd></div>
          <div>
            <dt>progress</dt>
            <dd data-field="counts">-</dd>
            <span class="wb-row__meter" data-field="meter" hidden></span>
          </div>
          <div><dt>completed</dt><dd data-field="completed">-</dd></div>
        </dl>
        <p class="wb-row__hint" data-field="hint"></p>
        <p class="wb-row__preview" data-field="preview" hidden></p>
        <ul class="wb-row__warnings" data-field="warnings" hidden></ul>
        <ul class="wb-row__artifacts" data-field="artifacts"></ul>
      </article>
    </template>

    <template id="wb-session-row-template">
      <li class="wb-session-row" data-session-id="">
        <span class="wb-session-row__id" data-field="id"></span>
        <span class="wb-session-row__status" data-field="status"></span>
        <span class="wb-session-row__path" data-field="path"></span>
      </li>
    </template>

    <template id="wb-event-row-template">
      <li class="wb-event-row">
        <time data-field="created_at"></time>
        <span class="wb-event-row__name" data-field="name"></span>
        <div class="wb-event-row__body">
          <span class="wb-event-row__summary" data-field="summary"></span>
          <details class="wb-event-row__details" hidden>
            <summary>payload</summary>
            <pre class="wb-event-row__payload" data-field="payload"></pre>
          </details>
        </div>
      </li>
    </template>

    <template id="wb-progress-row-template">
      <li class="wb-progress-row">
        <details class="wb-progress-row__details">
          <summary class="wb-progress-row__head">
            <span data-field="session_id"></span>
            <span data-field="status"></span>
            <time data-field="completed_at"></time>
          </summary>
          <p class="wb-progress-row__decisions" data-field="key_decisions"></p>
          <ul class="wb-progress-row__list" data-field="files_modified"></ul>
          <ul class="wb-progress-row__list" data-field="discovered_facts"></ul>
          <ul class="wb-progress-row__list" data-field="open_questions"></ul>
          <p class="wb-progress-row__blockers" data-field="blockers"></p>
        </details>
      </li>
    </template>

    <template id="wb-artifact-row-template">
      <li class="wb-artifact-row">
        <span class="wb-artifact-row__label" data-field="label"></span>
        <code class="wb-artifact-row__path" data-field="path"></code>
        <span class="wb-artifact-row__meta" data-field="meta"></span>
      </li>
    </template>
