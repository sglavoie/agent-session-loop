      <section class="wb-panel" id="wb-profile-panel">
        <h2 class="wb-panel__title">Launch profile</h2>
        <form
          id="wb-profile-form"
          class="wb-profile-form"
          novalidate
          autocomplete="off"
        >
          <div class="wb-profile-form__row">
            <label>
              <span>label</span>
              <input type="text" name="label" id="wb-profile-label" />
            </label>
            <label>
              <span>repository / workspace root <abbr title="required">*</abbr></span>
              <input
                type="text"
                name="cwd"
                id="wb-profile-cwd"
                required
                aria-required="true"
              />
            </label>
            <label>
              <span>harness <abbr title="required">*</abbr></span>
              <select
                name="harness"
                id="wb-profile-harness"
                required
                aria-required="true"
              >
                <option value="">(choose)</option>
                <option value="codex">codex</option>
                <option value="claude">claude</option>
                <option value="copilot">copilot</option>
              </select>
            </label>
            <label>
              <span>implementation model</span>
              <input
                type="text"
                name="harness_model"
                id="wb-profile-harness-model"
              />
            </label>
            <label>
              <span>effort</span>
              <input type="text" name="effort" id="wb-profile-effort" />
            </label>
            <label>
              <span>timeout (s)</span>
              <input type="number" name="timeout" id="wb-profile-timeout" min="1" />
            </label>
            <label>
              <span>commit mode</span>
              <select name="commit_mode" id="wb-profile-commit-mode">
                <option value="">(default)</option>
                <option value="per-session">per-session</option>
                <option value="end">end</option>
              </select>
            </label>
            <label>
              <span>review harness</span>
              <select name="review_harness" id="wb-profile-review-harness">
                <option value="">(none)</option>
                <option value="codex">codex</option>
                <option value="claude">claude</option>
                <option value="copilot">copilot</option>
              </select>
            </label>
            <label>
              <span>review model</span>
              <input
                type="text"
                name="review_harness_model"
                id="wb-profile-review-harness-model"
              />
            </label>
            <label>
              <span>max review-fix cycles</span>
              <input
                type="number"
                name="max_review_fix_cycles"
                id="wb-profile-max-review-fix-cycles"
                min="0"
              />
            </label>
            <label>
              <span>unsafe bypass</span>
              <select
                name="unsafe_bypass"
                id="wb-profile-unsafe-bypass"
                data-tri-state="true"
              >
                <option value="">(default)</option>
                <option value="true">enabled</option>
                <option value="false">disabled</option>
              </select>
            </label>
            <label>
              <span>allow not loop-ready</span>
              <select
                name="allow_not_loop_ready"
                id="wb-profile-allow-not-loop-ready"
                data-tri-state="true"
              >
                <option value="">(default)</option>
                <option value="true">enabled</option>
                <option value="false">disabled</option>
              </select>
            </label>
            <label class="wb-profile-form__textarea">
              <span>note</span>
              <textarea name="note" id="wb-profile-note" rows="2"></textarea>
            </label>
          </div>
          <p
            id="wb-profile-form-errors"
            class="wb-form__errors"
            role="alert"
            hidden
          ></p>
          <div class="wb-profile-form__actions">
            <button
              class="wb-button wb-button--primary"
              type="submit"
              data-action="save-profile"
              data-operation-action="pin"
            >
              save profile
            </button>
            <button
              class="wb-button"
              id="wb-profile-unpin"
              type="button"
              data-action="unpin"
              data-operation-action="unpin"
            >
              unpin
            </button>
          </div>
        </form>
      </section>
