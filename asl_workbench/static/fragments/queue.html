      <main class="wb-queue" id="wb-queue">
        <div class="wb-empty" id="wb-empty" data-state="loading">
          <p class="wb-empty__primary" id="wb-empty-primary">
            loading queue…
          </p>
          <p
            class="wb-empty__secondary"
            id="wb-empty-secondary"
            hidden
          ></p>
          <div class="wb-empty__actions" id="wb-empty-actions" hidden>
            <button
              class="wb-button wb-button--ghost"
              type="button"
              id="wb-empty-clear-search"
              hidden
            >
              clear search
            </button>
            <button
              class="wb-button wb-button--ghost"
              type="button"
              id="wb-empty-show-completed"
              hidden
            >
              show completed
            </button>
            <button
              class="wb-button wb-button--ghost"
              type="button"
              id="wb-empty-reset-filter"
              hidden
            >
              reset filter
            </button>
          </div>
        </div>
      </main>
